name: Deploy site

# Builds data/repos.json (a snapshot of every public repo) and publishes the site to GitHub Pages.
# Runs on every push, once a day so new repos show up automatically, and on demand.
# It only deploys; it never commits to the repository.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Snapshot repositories
        run: node scripts/fetch-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html 404.html CNAME robots.txt sitemap.xml assets css js data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
